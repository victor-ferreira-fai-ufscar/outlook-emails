services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outlook-emails-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: outlook-emails-evolution-api
    restart: unless-stopped
    depends_on:
      - evolution-redis
      - evolution-postgres
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      SERVER_DISABLE_DOCS: "false"
      SERVER_DISABLE_MANAGER: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: outlook-emails-evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution-cache
      CACHE_REDIS_SAVE_INSTANCES: "true"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      LANGUAGE: pt-BR
      CONFIG_SESSION_PHONE_CLIENT: Outlook Emails
      CONFIG_SESSION_PHONE_NAME: Chrome
      TELEMETRY_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://api:8000/whatsapp/webhook
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "false"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "false"
    volumes:
      - evolution_instances:/evolution/instances

  evolution-manager:
    image: evoapicloud/evolution-manager:latest
    container_name: outlook-emails-evolution-manager
    restart: unless-stopped
    depends_on:
      - evolution-api
    ports:
      - "3000:80"

  evolution-redis:
    image: redis:latest
    container_name: outlook-emails-evolution-redis
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data

  evolution-postgres:
    image: postgres:15
    container_name: outlook-emails-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data

volumes:
  evolution_instances:
  evolution_redis:
  evolution_postgres:
